<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Kogany mark: a vault door seen face-on. Outer ring, eight bolts,
       a three-spoke wheel on a hub. Drawn in currentColor. -->
  <symbol id="mark" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="32" cy="32" r="28" stroke-width="5"/>
      <circle cx="32" cy="32" r="17" stroke-width="3"/>
      <path d="M32 32V19M32 32l11.3 6.5M32 32l-11.3 6.5" stroke-width="4"/>
    </g>
    <g fill="currentColor">
      <circle cx="32" cy="32" r="5"/>
      <circle cx="32" cy="9.5" r="2"/><circle cx="32" cy="54.5" r="2"/>
      <circle cx="9.5" cy="32" r="2"/><circle cx="54.5" cy="32" r="2"/>
      <circle cx="16.1" cy="16.1" r="2"/><circle cx="47.9" cy="47.9" r="2"/>
      <circle cx="47.9" cy="16.1" r="2"/><circle cx="16.1" cy="47.9" r="2"/>
    </g>
  </symbol>
  <use href="#mark" color="#c8901e"/>
